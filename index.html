<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creador de Video HD con Visualizador Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-2xl border border-slate-700 space-y-6">
    <h1 class="text-2xl font-bold text-center text-indigo-400">Creador de Video con Visualizador Inteligente</h1>

    <!-- Controles de Archivos -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Imagen de portada</label>
        <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Archivo MP3</label>
        <input type="file" id="audioInput" accept="audio/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
      </div>
    </div>

    <!-- Opciones de Estilo del Visualizador -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Posición</label>
        <select id="positionSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500">
          <option value="bottom">Abajo (Foto)</option>
          <option value="top">Arriba (Invertido)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Color de Barras</label>
        <select id="barColorSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500">
          <option value="smart">Automático (Contraste)</option>
          <option value="white">Blanco</option>
          <option value="#6366f1">Índigo</option>
          <option value="#10b981">Esmeralda</option>
          <option value="#f43f5e">Rosa Fucsia</option>
          <option value="#eab308">Amarillo</option>
        </select>
      </div>
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-xs font-semibold uppercase text-slate-400">Opacidad</label>
          <span id="opacityValue" class="text-xs text-indigo-400 font-bold">85%</span>
        </div>
        <input type="range" id="opacityRange" min="0.1" max="1" step="0.05" value="0.85" class="w-full accent-indigo-500 cursor-pointer mt-1">
      </div>
    </div>

    <!-- Botón de Previsualización -->
    <div>
      <button id="previewToggleBtn" disabled class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 px-4 rounded-xl transition duration-200 disabled:opacity-40 disabled:cursor-not-allowed text-sm shadow">
        ▶ Reproducir Previsualización en Vivo
      </button>
    </div>

    <!-- Previsualización / Canvas en Tiempo Real -->
    <div class="relative aspect-video bg-black rounded-xl overflow-hidden border border-slate-700 flex items-center justify-center shadow-inner">
      <canvas id="previewCanvas" class="w-full h-full object-contain"></canvas>
      <div id="placeholderText" class="absolute text-slate-500 text-sm">Carga una imagen y un MP3 para comenzar</div>
    </div>

    <!-- Controles de Renderizado y Estado -->
    <div class="space-y-3">
      <button id="renderBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200 disabled:opacity-40 disabled:cursor-not-allowed shadow-lg">
        Grabar y Exportar Video HD Definitivo
      </button>

      <div id="statusBox" class="hidden text-center space-y-1">
        <p id="statusText" class="text-sm text-indigo-300 font-medium">Procesando...</p>
        <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-indigo-500 h-2 w-0 transition-all duration-150"></div>
        </div>
      </div>
    </div>

    <!-- Resultado / Descarga -->
    <div id="downloadArea" class="hidden text-center pt-2 border-t border-slate-700">
      <p class="text-xs text-emerald-400 font-semibold mb-2">¡Video generado con éxito!</p>
      <a id="downloadBtn" download="video_pro.webm" class="inline-block bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded-xl transition duration-200">
        Descargar Video
      </a>
    </div>
  </div>

  <audio id="audioElement" class="hidden"></audio>

  <script>
    const imageInput = document.getElementById('imageInput');
    const audioInput = document.getElementById('audioInput');
    const renderBtn = document.getElementById('renderBtn');
    const previewToggleBtn = document.getElementById('previewToggleBtn');
    const positionSelect = document.getElementById('positionSelect');
    const barColorSelect = document.getElementById('barColorSelect');
    const opacityRange = document.getElementById('opacityRange');
    const opacityValue = document.getElementById('opacityValue');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
    const audioElement = document.getElementById('audioElement');
    const placeholderText = document.getElementById('placeholderText');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const downloadArea = document.getElementById('downloadArea');
    const downloadBtn = document.getElementById('downloadBtn');

    let loadedImage = null;
    let audioUrl = null;
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let isInitialized = false;
    let animationFrameId = null;
    let isPreviewPlaying = false;
    let isRecording = false;

    opacityRange.addEventListener('input', (e) => {
      opacityValue.textContent = `${Math.round(e.target.value * 100)}%`;
      if (!isPreviewPlaying && !isRecording && loadedImage) drawCanvasFrame();
    });

    function initAudioContext() {
      if (isInitialized) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.8;

      sourceNode = audioCtx.createMediaElementSource(audioElement);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      isInitialized = true;
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        previewCanvas.width = img.width;
        previewCanvas.height = img.height;
        placeholderText.classList.add('hidden');
        drawCanvasFrame();
        checkReadyState();
      };
      img.src = URL.createObjectURL(file);
    });

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(file);
      audioElement.src = audioUrl;
      initAudioContext();
      checkReadyState();
    });

    function checkReadyState() {
      if (loadedImage && audioElement.src) {
        renderBtn.disabled = false;
        previewToggleBtn.disabled = false;
      }
    }

    function hexToRgba(hex, alpha) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
    }

    function getSmartBarColor(alpha) {
      if (!loadedImage) return `rgba(255, 255, 255, ${alpha})`;
      
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = 100;
      tempCanvas.height = 100;
      tempCtx.drawImage(loadedImage, 0, 0, 100, 100);
      
      const isTop = positionSelect.value === 'top';
      const imgData = tempCtx.getImageData(0, isTop ? 0 : 75, 100, 25).data;
      let r = 0, g = 0, b = 0, count = 0;
      
      for (let i = 0; i < imgData.length; i += 4) {
        r += imgData[i];
        g += imgData[i+1];
        b += imgData[i+2];
        count++;
      }
      
      r = Math.floor(r / count);
      g = Math.floor(g / count);
      b = Math.floor(b / count);
      
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 140 ? `rgba(15, 23, 42, ${alpha})` : `rgba(255, 255, 255, ${alpha})`;
    }

    function drawCanvasFrame() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

      if (!loadedImage) return;

      const hRatio = previewCanvas.width / loadedImage.width;
      const vRatio = previewCanvas.height / loadedImage.height;
      const ratio = Math.min(hRatio, vRatio);
      
      const renderWidth = loadedImage.width * ratio;
      const renderHeight = loadedImage.height * ratio;
      const startX = (previewCanvas.width - renderWidth) / 2;
      const startY = (previewCanvas.height - renderHeight) / 2;

      ctx.drawImage(loadedImage, 0, 0, loadedImage.width, loadedImage.height, startX, startY, renderWidth, renderHeight);

      if (analyser) {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        const currentAlpha = parseFloat(opacityRange.value);
        let colorVal = barColorSelect.value;

        if (colorVal === 'smart') {
          colorVal = getSmartBarColor(currentAlpha);
        } else if (colorVal === 'white') {
          colorVal = `rgba(255, 255, 255, ${currentAlpha})`;
        } else {
          colorVal = hexToRgba(colorVal, currentAlpha);
        }

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 8;
        ctx.fillStyle = colorVal;

        const barsCount = 56;
        const availableWidth = renderWidth;
        const barTotalWidth = availableWidth / barsCount;
        const barWidth = barTotalWidth * 0.75;
        const barSpacing = barTotalWidth * 0.25;
        
        const maxBarHeight = renderHeight * 0.18;
        const position = positionSelect.value;

        for (let i = 0; i < barsCount; i++) {
          const dataIndex = Math.floor((i / barsCount) * (bufferLength / 1.4));
          const percent = dataArray[dataIndex] / 255;
          const barHeight = Math.max(percent * maxBarHeight, renderHeight * 0.015);

          const x = startX + (i * barTotalWidth) + (barSpacing / 2);
          let y;

          if (position === 'bottom') {
            y = (startY + renderHeight) - barHeight;
          } else {
            y = startY;
          }

          ctx.fillRect(x, y, barWidth, barHeight);
        }

        ctx.restore();
      }
    }

    // Previsualización en Vivo continua
    previewToggleBtn.addEventListener('click', async () => {
      await audioCtx.resume();

      if (isPreviewPlaying) {
        audioElement.pause();
        cancelAnimationFrame(animationFrameId);
        previewToggleBtn.textContent = '▶ Reproducir Previsualización en Vivo';
        isPreviewPlaying = false;
      } else {
        audioElement.currentTime = 0;
        await audioElement.play();
        previewToggleBtn.textContent = '⏸ Pausa Previsualización';
        isPreviewPlaying = true;

        function previewLoop() {
          if (!isPreviewPlaying) return;
          drawCanvasFrame();
          animationFrameId = requestAnimationFrame(previewLoop);
        }
        previewLoop();
      }
    });

    audioElement.addEventListener('ended', () => {
      cancelAnimationFrame(animationFrameId);
      isPreviewPlaying = false;
      isRecording = false;
      previewToggleBtn.textContent = '▶ Reproducir Previsualización en Vivo';
      drawCanvasFrame();
    });

    // Grabación y exportación optimizada
    renderBtn.addEventListener('click', async () => {
      if (isPreviewPlaying) {
        audioElement.pause();
        cancelAnimationFrame(animationFrameId);
        isPreviewPlaying = false;
        previewToggleBtn.textContent = '▶ Reproducir Previsualización en Vivo';
      }

      renderBtn.disabled = true;
      previewToggleBtn.disabled = true;
      downloadArea.classList.add('hidden');
      statusBox.classList.remove('hidden');
      statusText.textContent = 'Preparando grabación de video HD...';

      await audioCtx.resume();

      const dest = audioCtx.createMediaStreamDestination();
      sourceNode.disconnect();
      sourceNode.connect(analyser);
      analyser.connect(dest);
      analyser.connect(audioCtx.destination);

      const canvasStream = previewCanvas.captureStream(30);
      const audioTrack = dest.stream.getAudioTracks()[0];
      if (audioTrack) {
        canvasStream.addTrack(audioTrack);
      }

      // Forzar WebM con codecs estables para evitar errores de contenedor 0:00
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') 
        ? 'video/webm;codecs=vp9,opus' 
        : 'video/webm';

      const recorder = new MediaRecorder(canvasStream, {
        mimeType,
        videoBitsPerSecond: 12000000
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        cancelAnimationFrame(animationFrameId);
        isRecording = false;
        
        const blob = new Blob(chunks, { type: mimeType });
        const videoUrl = URL.createObjectURL(blob);

        downloadBtn.href = videoUrl;
        downloadBtn.download = `video_visualizer.webm`;

        statusText.textContent = '¡Renderizado completado con éxito!';
        progressBar.style.width = '100%';
        downloadArea.classList.remove('hidden');
        renderBtn.disabled = false;
        previewToggleBtn.disabled = false;
        drawCanvasFrame();
      };

      isRecording = true;
      audioElement.currentTime = 0;
      recorder.start(1000); // Recolectar fragmentos cada segundo para asegurar estabilidad del buffer
      await audioElement.play();

      function recordLoop() {
        if (!isRecording) return;
        drawCanvasFrame();
        if (!audioElement.paused && !audioElement.ended) {
          const progress = (audioElement.currentTime / audioElement.duration) * 100;
          progressBar.style.width = `${progress}%`;
          statusText.textContent = `Grabando video: ${Math.floor(audioElement.currentTime)}s / ${Math.floor(audioElement.duration)}s`;
          animationFrameId = requestAnimationFrame(recordLoop);
        } else {
          recorder.stop();
        }
      }
      recordLoop();
    });
  </script>
</body>
</html>
